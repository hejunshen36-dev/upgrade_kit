name: upgrade_kit_android
description: Android implementation of upgrade_kit with APK installer permissions, FileProvider access and vendor app store routing.
version: 0.0.1
repository: https://github.com/hejunshen36-dev/upgrade_kit
homepage: https://github.com/hejunshen36-dev/upgrade_kit/tree/main/upgrade_kit_android
issue_tracker: https://github.com/hejunshen36-dev/upgrade_kit/issues

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter
  upgrade_kit_platform_interface: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: upgrade_kit
    platforms:
      android:
        package: com.egeio.upgrade_kit_android
        pluginClass: UpgradeKitAndroidPlugin
